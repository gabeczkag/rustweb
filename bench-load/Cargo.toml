[package]
name = "bench-load"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
hdrhistogram = "7"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "tokio"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }
