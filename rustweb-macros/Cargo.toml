[package]
name = "rustweb-macros"
version = "0.1.0"
edition = "2021"
description = "Procedural macros for rustweb"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gabeczkag/rustweb"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2.0", features = ["full", "extra-traits"] }
