[package]
name = "rtml"
version = "0.1.0"
edition = "2021"
description = "RTML templates and .rpack site packages for RustWeb"
license = "MIT OR Apache-2.0"

[dependencies]
bytes = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
mime_guess = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
