[package]
name = "mhtml"
version = "0.1.0"
edition = "2021"
description = "MHTML mini-HTML compiler and .rweb single-file bundler for RustWeb"
license = "MIT OR Apache-2.0"

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
mime_guess = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v5"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "rweb"
path = "src/bin/rweb.rs"
