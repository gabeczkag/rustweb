[package]
name = "rustweb"
version = "0.1.0"
edition = "2021"
description = "FastAPI-style web framework for Rust, built for low latency"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gabeczkag/rustweb"
keywords = ["web", "framework", "fastapi", "axum", "openapi"]
categories = ["web-programming::http-server"]

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
rustweb-macros = { path = "../rustweb-macros" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "rt"] }
utoipa = "6.0"
utoipa-swagger-ui = { version = "10.0", features = ["axum", "vendored"] }
validator = { version = "0.21", features = ["derive"] }

[dev-dependencies]
http-body-util = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
