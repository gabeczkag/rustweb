[package]
name = "rustweb"
version = "0.1.0"
edition = "2021"
description = "FastAPI-style web framework for Rust, built for low latency"
license = "MIT OR Apache-2.0"
keywords = ["web", "framework", "fastapi", "axum", "openapi"]
categories = ["web-programming::http-server"]

[features]
default = ["cli"]
cli = ["dep:clap"]

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
clap = { version = "4", features = ["derive"], optional = true }
mhtml = { path = "../mhtml" }
rustweb-macros = { path = "../rustweb-macros" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt", "rt-multi-thread"] }
utoipa = "6.0"
utoipa-swagger-ui = { version = "10.0", features = ["axum", "vendored"] }
validator = { version = "0.21", features = ["derive"] }

[dev-dependencies]
http-body-util = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "rustweb"
path = "src/bin/rustweb.rs"
required-features = ["cli"]
