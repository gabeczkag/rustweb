[package]
name = "uc"
version = "0.1.0"
edition = "2021"
publish = false
description = "Binary compression packs for small machine-readable packets"
license = "MIT OR Apache-2.0"

[dependencies]
axum = "0.8.9"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
zstd = "0.13"

[dev-dependencies]
tempfile = "3"
